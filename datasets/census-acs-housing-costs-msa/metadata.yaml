schema_version: 1
id: census-acs-housing-costs-msa
title: 'Census ACS 1-year 2022 and 2023: median home value, rents, real estate taxes, rooms and tenure for all geographies'
description: 'Twelve table-based summary files of the American Community Survey 1-year estimates, kept byte for
  byte: median value of owner-occupied homes (B25077), median gross rent (B25064), median contract rent (B25058),
  median real estate taxes paid (B25103), median rooms by tenure (B25021) and tenure counts (B25003), for 2022 and
  2023, every geography in the release including the nation and metropolitan statistical areas. Used to set price,
  rent and property-tax levels in one year so that index series can be turned into dollars. Taken from the static
  summary-file directory because the Census data API now requires a key.'
