schema_version: 1

id: eurostat-services-relative-prices
title: "Eurostat: industry prices, wages, hours and margins, consumer prices of services and goods, and price levels, EU 1995-2025"
description: >
  Five Eurostat API responses, kept byte for byte, that measure why the
  prices of services move relative to goods in the EU and its member states:
  value added at current prices and in volume, compensation of employees,
  operating surplus, taxes on production and depreciation by NACE section,
  hours worked by all workers and by employees, HICP indices and weights for
  services, goods and selected items, and PPP price level indices for goods
  and services. Snapshotted because Eurostat's API serves only the current
  vintage of each dataset.

domain:
  - economics
  - national-accounts
  - prices
  - labour-market
  - productivity
  - eu

