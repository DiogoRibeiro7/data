schema_version: 1

id: eurostat-food-vat-incidence
title: "Eurostat: household budgets, food shares and incomes by income fifth, for the incidence of VAT on food, EU 2010-2025"
description: >
  Seven Eurostat API responses, kept byte for byte, that show how the share
  of the household budget spent on food, drink and restaurants varies across
  income fifths in each member state, how much each fifth spends, what share
  of disposable income goes on food, where given incomes fall in each national
  income distribution, and how food prices moved since the last survey.
  Together they let a reader compute who gains, in euros and as a share of the
  budget, from a change in VAT on food. Snapshotted because Eurostat's API
  serves only the current vintage of each dataset.

