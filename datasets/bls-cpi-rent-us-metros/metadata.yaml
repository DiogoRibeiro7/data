schema_version: 1
id: bls-cpi-rent-us-metros
title: 'BLS consumer price index: rent of primary residence for the U.S. and 16 metropolitan areas, and all-items
  CPI-U'
description: 'Eighteen responses kept byte for byte: the CPI-U index of rent of primary residence (not seasonally
  adjusted) for the U.S. city average and for sixteen metropolitan areas that also have an S&P CoreLogic Case-Shiller
  home price index, plus the all-items CPI-U. Retrieved from FRED''s graph CSV endpoint, and from DBnomics for the
  two areas whose current BLS series FRED does not carry (Washington, and Los Angeles after 2017). Snapshotted because
  both services serve only the latest vintage. Metropolitan rent indices are published monthly, bimonthly, semiannually
  or annually depending on the area and period; each file keeps the frequency it was served in.'
domain:
- economics
- prices
- housing
- rents
- united-states
