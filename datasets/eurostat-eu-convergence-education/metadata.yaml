schema_version: 1

id: eurostat-eu-convergence-education
title: "Eurostat: GDP per head, labour productivity and adult educational attainment in the EU member states, 1975-2025"
description: >
  Four Eurostat API responses, kept byte for byte, that place each EU member
  state on GDP and consumption per head and on labour productivity in
  purchasing power standards relative to the EU average, and that show how
  much of its adult population, by ten-year age band, and of its managers
  has at most lower secondary education. Together they let a reader follow
  income convergence since 1995 and the age profile of educational
  attainment in the same countries. Snapshotted because Eurostat's API
  serves only the current vintage of each dataset.

