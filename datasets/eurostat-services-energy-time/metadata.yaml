schema_version: 1

id: eurostat-services-energy-time
title: "Eurostat: value added, hours worked, final energy, time use, consumption and prices for EU services, 1995-2025"
description: >
  Seven Eurostat API responses, kept byte for byte, that together measure the
  inputs of the service sector in the EU and its member states: real and
  nominal value added and hours worked by NACE A*10 industry, final energy
  consumption by sector, HETUS time use (2000 and 2010 waves), per-capita
  consumption, population and HICP services prices. Snapshotted because
  Eurostat's API serves only the current vintage of each dataset.

domain:
  - economics
  - national-accounts
  - energy
  - labour-market
  - time-use
  - prices
  - eu

