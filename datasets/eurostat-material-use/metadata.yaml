schema_version: 1

id: eurostat-material-use
title: "Eurostat: EU material use, material footprint, circularity and waste treatment, with GDP, construction and population, 2000-2025"
description: >
  Ten Eurostat API responses, kept byte for byte, that measure how much
  material the EU and its member states use and where it goes: domestic
  material consumption by material group, the material footprint in raw
  material equivalents (also by final use), the circular material use rate,
  the material-flow data behind Eurostat's Sankey diagram, waste treatment by
  type, and GDP, construction output and population for the same countries.
  Snapshotted because Eurostat's API serves only the current vintage of each
  dataset.

domain:
  - environment
  - material-flows
  - circular-economy
  - waste
  - national-accounts
  - eu

