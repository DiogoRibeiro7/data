schema_version: 1

id: oecd-share-prices-bond-yields-cpi
title: "OECD: share price indices, long-term government bond yields and consumer prices, 23 markets, 1914-2025"
description: >
  Three OECD SDMX responses, kept byte for byte, for the 23 OECD members of
  1973 without Turkey: monthly share price indices and long-term (10-year)
  government bond yields from the financial market statistics, and the
  consumer price index (all items) at monthly, quarterly and annual frequency.
  Together they give real share price returns and approximate real bond
  returns from the 1950s to 2025. The share price indices leave out
  dividends. Snapshotted because the OECD API serves only the current vintage
  of each dataflow.

domain:
  - economics
  - finance
  - asset-returns
  - prices
  - oecd

