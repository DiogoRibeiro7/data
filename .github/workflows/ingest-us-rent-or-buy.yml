name: Ingest US rent-or-buy sources (temporary)

on:
  push:
    branches:
      - source/us-rent-or-buy-20261122
    paths:
      - 'ingest/us-rent-or-buy/ingest.py'
      - '.github/workflows/ingest-us-rent-or-buy.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download
        run: python ingest/us-rent-or-buy/ingest.py
      - name: Commit what came back
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add datasets ingest/us-rent-or-buy/manifest.tsv ingest/us-rent-or-buy/errors || true
          git add datasets ingest/us-rent-or-buy/manifest.tsv
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "Ingest run for US rent-or-buy sources ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
