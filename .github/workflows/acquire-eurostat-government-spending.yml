name: Acquire Eurostat government spending candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/acquire_eurostat_government_spending.py
      - tests/test_acquire_eurostat_government_spending.py
      - .github/workflows/acquire-eurostat-government-spending.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test query construction
        run: python -m unittest discover -s tests -p test_acquire_eurostat_government_spending.py -v
      - name: Acquire candidate data
        run: python scripts/acquire_eurostat_government_spending.py --output eurostat-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: eurostat-government-spending-candidate
          path: eurostat-candidate/
          if-no-files-found: error
          retention-days: 30
