name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "datasets/CATALOG.md"
      - "external/CATALOG.md"
      - "consumers/CATALOG.md"
      - "legacy/INVENTORY.md"
      - "CONTRIBUTING.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/prepare_docs.py"
      - "scripts/registry_quality.py"
      - "reports/registry-quality.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "datasets/CATALOG.md"
      - "external/CATALOG.md"
      - "consumers/CATALOG.md"
      - "legacy/INVENTORY.md"
      - "CONTRIBUTING.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/prepare_docs.py"
      - "scripts/registry_quality.py"
      - "reports/registry-quality.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Prepare generated documentation pages
        run: python scripts/prepare_docs.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
