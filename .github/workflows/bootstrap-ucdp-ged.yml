name: Bootstrap UCDP GED 25.1

on:
  push:
    branches:
      - feat/canonical-ucdp-ged-25-1
    paths:
      - ".github/workflows/bootstrap-ucdp-ged.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/canonical-ucdp-ged-25-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch and inspect official GED 25.1 archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://ucdp.uu.se/downloads/ged/ged251-csv.zip"
          archive="$RUNNER_TEMP/ged251-csv.zip"
          extract_dir="$RUNNER_TEMP/ged251"
          mkdir -p "$extract_dir"

          curl --fail --location --retry 4 --retry-delay 2 --output "$archive" "$url"

          mapfile -t csv_files < <(unzip -Z1 "$archive" | grep -E '\.csv$')
          if [ "${#csv_files[@]}" -ne 1 ]; then
            printf 'Expected exactly one CSV in archive; found %s\n' "${#csv_files[@]}" >&2
            printf '%s\n' "${csv_files[@]}" >&2
            exit 1
          fi

          csv_name="${csv_files[0]}"
          unzip -p "$archive" "$csv_name" > "$extract_dir/source.csv"

          mkdir -p datasets/ucdp-ged-25-1/raw
          cp "$archive" datasets/ucdp-ged-25-1/raw/ged251-csv.zip

          ARCHIVE="$archive" CSV="$extract_dir/source.csv" CSV_NAME="$csv_name" python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          csv_path = Path(os.environ["CSV"])
          csv_name = os.environ["CSV_NAME"]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          with csv_path.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              columns = reader.fieldnames or []
              rows = 0
              min_start: str | None = None
              max_end: str | None = None
              min_year: int | None = None
              max_year: int | None = None
              for row in reader:
                  rows += 1
                  start = row.get("date_start")
                  end = row.get("date_end")
                  year_raw = row.get("year")
                  if start:
                      min_start = start if min_start is None else min(min_start, start)
                  if end:
                      max_end = end if max_end is None else max(max_end, end)
                  if year_raw:
                      year = int(year_raw)
                      min_year = year if min_year is None else min(min_year, year)
                      max_year = year if max_year is None else max(max_year, year)

          inspection = {
              "source_url": "https://ucdp.uu.se/downloads/ged/ged251-csv.zip",
              "version": "25.1",
              "archive": {
                  "filename": "ged251-csv.zip",
                  "size_bytes": archive.stat().st_size,
                  "sha256": sha256(archive),
              },
              "contained_csv": {
                  "filename": csv_name,
                  "size_bytes": csv_path.stat().st_size,
                  "sha256": sha256(csv_path),
                  "row_count": rows,
                  "column_count": len(columns),
                  "columns": columns,
                  "min_year": min_year,
                  "max_year": max_year,
                  "min_date_start": min_start,
                  "max_date_end": max_end,
              },
          }

          out = Path("datasets/ucdp-ged-25-1/source-inspection.json")
          out.write_text(
              json.dumps(inspection, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(inspection, indent=2))
          PY

      - name: Commit authoritative source archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/ucdp-ged-25-1/raw/ged251-csv.zip datasets/ucdp-ged-25-1/source-inspection.json
          git commit -m "data: fetch authoritative UCDP GED 25.1 archive [ucdp-bootstrap]"
          git push origin HEAD:feat/canonical-ucdp-ged-25-1
