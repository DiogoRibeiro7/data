name: Acquire CWON 2024 wealth resilience candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test acquisition contract
        run: python -m unittest discover -s tests -p test_acquire_cwon_gdp_resilience.py -v
      - name: Acquire reviewed source vintage
        run: python -m scripts.acquire_cwon_gdp_resilience --output cwon-candidate
      - name: Upload candidate for review
        uses: actions/upload-artifact@v7
        with:
          name: cwon-2024-gdp-resilience-candidate
          path: cwon-candidate/
          if-no-files-found: error
          retention-days: 30
