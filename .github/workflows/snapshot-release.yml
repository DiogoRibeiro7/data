name: Snapshot release

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "Snapshot tag (snapshot-YYYY.MM.DD or snapshot-YYYY.MM.DD.N)"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character commit SHA to snapshot"
        required: true
        type: string
      publish_release:
        description: "Create the Git tag and GitHub release after validation"
        required: true
        default: false
        type: boolean

# The reusable publisher contains a live job that needs contents: write.
# GitHub validates this permission ceiling even when publish_release=false.
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install registry package and validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Validate external catalog freshness
        run: python scripts/generate_external_catalog.py

      - name: Validate consumer catalog freshness
        run: python scripts/generate_consumer_catalog.py

      - name: Validate registry quality freshness
        run: python scripts/registry_quality.py

      - name: Validate provenance debt freshness
        run: python scripts/generate_provenance_debt.py

      - name: Validate lifecycle report freshness
        run: python scripts/generate_lifecycle_report.py

      - name: Validate static registry distribution
        run: python scripts/generate_static_distribution.py

      - name: Generate release material
        run: |
          python scripts/create_snapshot.py \
            --tag "${{ inputs.snapshot_tag }}" \
            --commit "${{ inputs.commit_sha }}" \
            --output-dir release-material

      - name: Upload immutable release material
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.snapshot_tag }}
          path: release-material/
          if-no-files-found: error
          retention-days: 90

  release:
    needs: prepare
    permissions:
      contents: write
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/snapshot-release.yml@6c68c76f3cec5b61552d24aa724fbd3398c33dbd
    with:
      snapshot-tag: ${{ inputs.snapshot_tag }}
      commit-sha: ${{ inputs.commit_sha }}
      artifact-name: ${{ inputs.snapshot_tag }}
      release-title: Registry snapshot ${{ inputs.snapshot_tag }}
      tag-message: Registry snapshot ${{ inputs.snapshot_tag }}
      dry-run: ${{ !inputs.publish_release }}
