name: One-time Online Retail II canonical import

on:
  push:
    branches:
      - feat/canonical-online-retail-ii
    paths:
      - ".github/workflows/import-online-retail-ii.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out import branch
        uses: actions/checkout@v7
        with:
          ref: feat/canonical-online-retail-ii
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download authoritative UCI source
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          curl --fail --location --retry 3 --retry-all-errors \
            "https://archive.ics.uci.edu/static/public/502/online%2Bretail%2Bii.zip" \
            --output "$tmpdir/online-retail-ii.zip"

          unzip -q "$tmpdir/online-retail-ii.zip" -d "$tmpdir/extracted"

          source_file="$(find "$tmpdir/extracted" -type f -iname 'online_retail_II.xlsx' -print -quit)"
          test -n "$source_file"
          test -f "$source_file"

          mkdir -p datasets/online-retail-ii/raw
          cp "$source_file" datasets/online-retail-ii/raw/online_retail_II.xlsx

          sha256sum datasets/online-retail-ii/raw/online_retail_II.xlsx \
            | awk '{print $1}' > "$tmpdir/sha256"

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          path = Path("datasets/online-retail-ii/raw/online_retail_II.xlsx")
          if path.stat().st_size < 25 * 1024 * 1024:
              raise SystemExit("unexpected source size: expected file >=25 MiB")

          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"source_size_bytes={path.stat().st_size}")
          print(f"source_sha256={digest}")

          # XLSX is itself a ZIP container. Confirm it is a structurally valid workbook
          # without modifying it.
          with zipfile.ZipFile(path) as workbook:
              required = {"[Content_Types].xml", "xl/workbook.xml"}
              missing = required - set(workbook.namelist())
              if missing:
                  raise SystemExit(f"invalid XLSX; missing {sorted(missing)}")
          PY

      - name: Write canonical metadata and documentation
        shell: bash
        run: |
          set -euo pipefail

          SHA256="$(sha256sum datasets/online-retail-ii/raw/online_retail_II.xlsx | awk '{print $1}')"
          SIZE_BYTES="$(stat -c '%s' datasets/online-retail-ii/raw/online_retail_II.xlsx)"

          cat > datasets/online-retail-ii/metadata.yaml <<EOF
          schema_version: 1

          id: online-retail-ii
          title: "Online Retail II"
          description: >
            Two years of transactions from a UK-based non-store online retailer,
            covering 1 December 2009 through 9 December 2011.

          domain:
            - business
            - retail
            - transactions

          source:
            publisher: "UCI Machine Learning Repository"
            url: "https://archive.ics.uci.edu/dataset/502/online+retail+ii"
            retrieved_at: 2026-10-01
            snapshot: "UCI dataset 502 / DOI 10.24432/C5CG6D / retrieved 2026-10-01"

          license:
            name: "CC BY 4.0"
            url: "https://creativecommons.org/licenses/by/4.0/"
            redistribution: allowed

          citation:
            text: "Chen, D. (2012). Online Retail II [Dataset]. UCI Machine Learning Repository."
            url: "https://doi.org/10.24432/C5CG6D"

          files:
            - path: raw/online_retail_II.xlsx
              role: raw
              format: xlsx
              sha256: "$SHA256"
              large_file_reviewed: true
              row_count: 1067371
              column_count: 8
              notes: "Authoritative UCI workbook preserved byte-for-byte; source size $SIZE_BYTES bytes."

          lineage: []
          EOF

          cat > datasets/online-retail-ii/README.md <<'EOF'
          # Online Retail II

          Canonical snapshot of the UCI Machine Learning Repository **Online Retail II** dataset.

          ## Source

          - Publisher: UCI Machine Learning Repository
          - Creator: Daqing Chen
          - UCI dataset ID: 502
          - DOI: [10.24432/C5CG6D](https://doi.org/10.24432/C5CG6D)
          - Source page: https://archive.ics.uci.edu/dataset/502/online+retail+ii
          - Retrieved: 2026-10-01
          - Licence: [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)

          ## Coverage

          The dataset contains **1,067,371 transactions** from a UK-based,
          registered, non-store online retailer between **1 December 2009**
          and **9 December 2011**.

          UCI describes eight fields:

          - InvoiceNo
          - StockCode
          - Description
          - Quantity
          - InvoiceDate
          - UnitPrice
          - CustomerID
          - Country

          Missing values are present in the source data.

          ## Canonical file

          `raw/online_retail_II.xlsx` is the authoritative UCI workbook downloaded
          from the dataset-502 download endpoint. It is stored without transformation.

          The exact SHA-256 is recorded in `metadata.yaml`.

          Because the workbook exceeds 25 MiB, its direct-Git storage was reviewed
          explicitly under the repository large-file policy.

          ## Citation

          > Chen, D. (2012). Online Retail II [Dataset]. UCI Machine Learning Repository.
          > https://doi.org/10.24432/C5CG6D

          This registry snapshot does not replace the upstream citation or attribution
          requirement.
          EOF

      - name: Remove redundant external-only record
        run: rm -rf external/online-retail-ii

      - name: Regenerate catalogs
        run: |
          python scripts/validate_repository.py --write-catalog
          python scripts/generate_external_catalog.py --write

      - name: Validate imported registry state
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_repository.py
          python scripts/generate_external_catalog.py

      - name: Commit canonical import and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-online-retail-ii.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "data: promote UCI Online Retail II to canonical registry"
          git push origin HEAD:feat/canonical-online-retail-ii
