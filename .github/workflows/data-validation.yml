name: Data validation

on:
  pull_request:
    paths:
      - "datasets/**"
      - "legacy/**"
      - "external/**"
      - "consumers/**"
      - "schemas/**"
      - "templates/consumer-dataset.yaml"
      - "scripts/validate_repository.py"
      - "scripts/fetch_dataset.py"
      - "scripts/generate_external_catalog.py"
      - "scripts/generate_consumer_catalog.py"
      - "scripts/registry.py"
      - "scripts/create_snapshot.py"
      - "scripts/check_external_sources.py"
      - "scripts/check_consumer_contracts.py"
      - "scripts/registry_quality.py"
      - "scripts/generate_provenance_debt.py"
      - "tests/test_validate_repository.py"
      - "tests/test_fetch_dataset.py"
      - "tests/test_external_catalog.py"
      - "tests/test_consumer_catalog.py"
      - "tests/test_registry.py"
      - "tests/test_snapshot.py"
      - "tests/test_external_health.py"
      - "tests/test_consumer_health.py"
      - "tests/test_citation_metadata.py"
      - "tests/test_registry_quality.py"
      - "tests/test_provenance_debt.py"
      - "reports/registry-quality.json"
      - "reports/registry-quality.md"
      - "reports/provenance-debt.json"
      - "reports/provenance-debt.md"
      - "docs/QUALITY.md"
      - "scripts/prepare_docs.py"
      - "mkdocs.yml"
      - "requirements-dev.txt"
      - "CITATION.cff"
      - "codemeta.json"
      - "docs/CITATION.md"
      - ".github/workflows/data-validation.yml"
      - ".github/workflows/snapshot-release.yml"
      - ".github/workflows/external-source-health.yml"
      - ".github/workflows/consumer-contract-health.yml"
  push:
    branches:
      - main
    paths:
      - "datasets/**"
      - "legacy/**"
      - "external/**"
      - "consumers/**"
      - "schemas/**"
      - "templates/consumer-dataset.yaml"
      - "scripts/validate_repository.py"
      - "scripts/fetch_dataset.py"
      - "scripts/generate_external_catalog.py"
      - "scripts/generate_consumer_catalog.py"
      - "scripts/registry.py"
      - "scripts/create_snapshot.py"
      - "scripts/check_external_sources.py"
      - "scripts/check_consumer_contracts.py"
      - "scripts/registry_quality.py"
      - "scripts/generate_provenance_debt.py"
      - "tests/test_validate_repository.py"
      - "tests/test_fetch_dataset.py"
      - "tests/test_external_catalog.py"
      - "tests/test_consumer_catalog.py"
      - "tests/test_registry.py"
      - "tests/test_snapshot.py"
      - "tests/test_external_health.py"
      - "tests/test_consumer_health.py"
      - "tests/test_citation_metadata.py"
      - "tests/test_registry_quality.py"
      - "tests/test_provenance_debt.py"
      - "reports/registry-quality.json"
      - "reports/registry-quality.md"
      - "reports/provenance-debt.json"
      - "reports/provenance-debt.md"
      - "docs/QUALITY.md"
      - "scripts/prepare_docs.py"
      - "mkdocs.yml"
      - "requirements-dev.txt"
      - "CITATION.cff"
      - "codemeta.json"
      - "docs/CITATION.md"
      - ".github/workflows/data-validation.yml"
      - ".github/workflows/snapshot-release.yml"
      - ".github/workflows/external-source-health.yml"
      - ".github/workflows/consumer-contract-health.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate datasets and catalog
        run: python scripts/validate_repository.py

      - name: Validate external source catalog
        run: python scripts/generate_external_catalog.py

      - name: Validate consumer catalog
        run: python scripts/generate_consumer_catalog.py

      - name: Validate registry quality report
        run: |
          python scripts/registry_quality.py --write
          git diff --exit-code -- reports/registry-quality.json reports/registry-quality.md

      - name: Validate provenance debt report
        run: python scripts/generate_provenance_debt.py
