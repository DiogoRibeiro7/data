name: Data validation

on:
  pull_request:
    paths:
      - "datasets/**"
      - "legacy/**"
      - "external/**"
      - "schemas/**"
      - "scripts/validate_repository.py"
      - "scripts/fetch_dataset.py"
      - "scripts/generate_external_catalog.py"
      - "scripts/registry.py"
      - "scripts/create_snapshot.py"
      - "scripts/check_external_sources.py"
      - "scripts/check_external_sources.py"
      - "tests/test_validate_repository.py"
      - "tests/test_fetch_dataset.py"
      - "tests/test_external_catalog.py"
      - "tests/test_registry.py"
      - "tests/test_snapshot.py"
      - "tests/test_external_health.py"
      - "tests/test_external_health.py"
      - "requirements-dev.txt"
      - ".github/workflows/data-validation.yml"
      - ".github/workflows/snapshot-release.yml"
      - ".github/workflows/external-source-health.yml"
      - ".github/workflows/external-source-health.yml"
  push:
    branches:
      - main
    paths:
      - "datasets/**"
      - "legacy/**"
      - "external/**"
      - "schemas/**"
      - "scripts/validate_repository.py"
      - "scripts/fetch_dataset.py"
      - "scripts/generate_external_catalog.py"
      - "scripts/registry.py"
      - "scripts/create_snapshot.py"
      - "tests/test_validate_repository.py"
      - "tests/test_fetch_dataset.py"
      - "tests/test_external_catalog.py"
      - "tests/test_registry.py"
      - "tests/test_snapshot.py"
      - "requirements-dev.txt"
      - ".github/workflows/data-validation.yml"
      - ".github/workflows/snapshot-release.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate datasets and catalog
        run: python scripts/validate_repository.py

      - name: Validate external source catalog
        run: python scripts/generate_external_catalog.py
