permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install registry package and validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate datasets and catalog
        run: python scripts/validate_repository.py

      - name: Validate external source catalog
        run: python scripts/generate_external_catalog.py

      - name: Validate consumer catalog
        run: python scripts/generate_consumer_catalog.py

      - name: Validate registry quality report
        run: |
          python scripts/registry_quality.py --write
          git diff --exit-code -- reports/registry-quality.json reports/registry-quality.md

      - name: Validate provenance debt report
        run: python scripts/generate_provenance_debt.py

      - name: Validate registry changelog
        run: python scripts/generate_registry_changelog.py

      - name: Validate lifecycle report
        run: python scripts/generate_lifecycle_report.py

      - name: Validate preservation eligibility report
        run: python scripts/generate_preservation_eligibility.py

      - name: Validate static registry distribution
        run: python scripts/generate_static_distribution.py


  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test installed client
        run: |
          python -c "import data_registry; print(data_registry.__name__)"
          data-registry --root . list --json > /tmp/registry.json
          data-registry --root . verify online-retail-ii --json > /tmp/verify.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/registry.json").read_text())
          assert isinstance(payload, list)
          assert payload
          verified = json.loads(Path("/tmp/verify.json").read_text())
          assert verified["ok"] is True
          PY
