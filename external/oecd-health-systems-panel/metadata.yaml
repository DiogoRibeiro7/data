resolution:
  review_status: actionable
  last_reviewed: 2026-11-28
  blocker_category: redistribution-rights
  blocker_summary: >-
    The OECD general terms permit reuse with attribution, but source ownership of the individual
    series (national health accounts, national mortality statistics, national accounts) has not
    been checked, so redistribution of the bytes is unresolved. The dataflows are mutable and
    the consumers do not yet verify the recorded hashes.
  evidence:
    - "https://www.oecd.org/en/about/terms-conditions.html"
    - "https://sdmx.oecd.org/public/rest/data/OECD.ELS.HD,DSD_SHA@DF_SHA,/all?startPeriod=2000&format=csvfile"
  reviewer_note: >-
    Constant-price USD PPP series can be rebased or revised by OECD releases. The SHA response
    is large; the consumer requests only the key listed above. Treatable mortality has no
    observations for Greece before 2014 and gaps for Portugal (2004-2006, 2020-2021); real
    health expenditure per person shows one-year breaks of 11-28% for Luxembourg, Sweden and
    Japan in 2011-2012 that do not match movements in GDP per person.
  next_action: >-
    Add run-time SHA-256 verification (or an explicit refresh step) to fetch_data.py in both
    consumers; verify series-level ownership in OECD Data Explorer for the series used; then
    consider a canonical snapshot of the filtered panel inputs if redistribution is cleared.
  terminal: false
