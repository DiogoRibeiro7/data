schema_version: 1
status: external-reference
id: oecd-health-systems-panel
title: "OECD health systems panel: avoidable mortality, life expectancy, health expenditure, tobacco and alcohol, GDP per person, population by age and weekly excess mortality"
publisher: "Organisation for Economic Co-operation and Development (OECD)"
source_url: "https://sdmx.oecd.org/public/rest/data/OECD.ELS.HD,DSD_HEALTH_STAT@DF_AM,/all?startPeriod=2000&format=csvfile"
license:
  name: "OECD Terms and Conditions (verify any third-party or series-specific rights)"
  url: "https://www.oecd.org/en/about/terms-conditions.html"
redistribution: unresolved
storage: authoritative-upstream
usage:
  storage: consumer-downloads
  redistribution: unresolved
  attribution_required: true
  note: >-
    Two Medium-Blog folders download the same eight OECD SDMX CSV responses at every run and
    build a country-year panel of the 38 OECD members (2000-2023) from them: age-standardised
    avoidable, treatable and preventable mortality (DF_AM), life expectancy at birth (DF_LE),
    health expenditure from the System of Health Accounts in constant-price USD PPP per person,
    as a share of GDP and as a share of health expenditure for financing schemes HF1 and HF3 and
    function HC6 (DF_SHA, filtered by the consumer to sha_slim.csv), tobacco and alcohol
    consumption (DF_HEALTH_LVNG_TC and _AC), real GDP per person (DF_TABLE1_EXPENDITURE_HVPVOB),
    population by age (DF_POP_HIST) and weekly excess mortality from March 2020
    (DF_MORTALITY_EXCESS, used by the first consumer only). All eight files were byte-identical
    across two full downloads on 2026-11-28, about 80 minutes apart, but the OECD dataflows are
    mutable (revisions, new years, rebased constant prices), so the hashes pin one retrieval and
    do not make the live endpoints immutable. The consumers do not yet verify the hashes at run
    time. No bytes are stored in Medium-Blog or in this registry.
consumers:
  - medium-blog/oecd-health-spending-outcomes
  - medium-blog/oecd-health-austerity
medium_blog:
  folder: oecd-health-spending-outcomes
  fetch: "oecd-health-spending-outcomes/src/fetch_data.py"
  also_used_by:
    - folder: oecd-health-austerity
      fetch: "oecd-health-austerity/src/fetch_data.py"
      note: "same fetch script, same eight queries; the pandemic file is downloaded but not used"
  retrieved: "2026-11-28"
  derived_output: "data/panel.csv in each folder (built by build_panel.py, not committed)"
  files:
    - path: "raw/am.csv"
      dataset: "OECD.ELS.HD,DSD_HEALTH_STAT@DF_AM"
      url: "https://sdmx.oecd.org/public/rest/data/OECD.ELS.HD,DSD_HEALTH_STAT@DF_AM,/all?startPeriod=2000&format=csvfile"
