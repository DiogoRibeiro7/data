  note: >-
    The page reports, for 29 countries with at least 5 rated reports, the mean
    0-10 happiness rating, the mean 0-10 rating of satisfaction with tax-paid
    services, the number of rated reports, and the average effective tax
    rate, savings rate and net pay. Totals on 22 November 2026: 1,673
    approved self-reported submissions, 782 with both ratings; the 29 listed
    countries hold 744 of them. The page recomputes from a live database,
    offers no download, standard deviations or intervals, and says thin
    samples (5-9 reports) can shift with a handful of new submissions, so a
    later visit can show other numbers. Respondents are self-selected
    engineers, not a sample of residents. The consumer transcribes the table
    as read on 22 November 2026 into snapshot.py; the SHA-256 below is taken
    over that module's canonical text (one comma-separated line per country,
    fixed decimals) and is checked by the consumer's tests. No bytes are
    mirrored here.
