  note: >-
    The Datahub package declares ODC-PDDL-1.0 for its packaging and names FRED's
    release tables of the S&P CoreLogic Case-Shiller indices as its source. The
    indices are a trademarked, copyrighted S&P Dow Jones Indices product, so the
    PDDL declaration is treated as the mirror's statement, not the originator's
    grant, and no bytes are kept here. The consumer downloads the two files from
    the pinned mirror commit and checks their SHA-256. Not seasonally adjusted
    levels, January 2000 = 100; the mirror writes 0.000 for months before a city's
    series starts (Atlanta 1987-1990), which the consumer treats as missing. Cite
    S&P CoreLogic Case-Shiller Home Price Indices.
