  note: >-
    Eighteen books by Austen (3), Blake, Bryant, Burgess, Carroll,
    Chesterton (3), Edgeworth, Melville, Milton, Shakespeare (3), Whitman
    and the King James Bible, with the Project Gutenberg headers removed by
    NLTK. Pinned to nltk_data commit 550b662 on branch gh-pages; the zip's
    SHA-256 equals the sha256_checksum in the nltk_data index.
    medium-blog/decoding-loops downloads it at every run, checks the digest
    and draws 144 prompts (8 evenly spaced passages per book). No bytes are
    mirrored here.
