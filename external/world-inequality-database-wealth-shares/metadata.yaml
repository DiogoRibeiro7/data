schema_version: 1
status: external-reference
id: world-inequality-database-wealth-shares
title: "WID.world distribution of net personal wealth by percentile"
publisher: "World Inequality Lab / World Inequality Database (WID.world)"
source_url: "https://wid.world/data/"
redistribution: unresolved
storage: authoritative-upstream
usage:
  storage: project-local
  redistribution: unresolved
  attribution_required: true
  note: >-
    The wealth_rentier_dynamics project implements an optional local ZIP loader
    for the WID full-database download. It reads WID_data_<CC>.csv country
    members and variable shwealj992 at p99p100, p90p100 and p0p50. Its
    country-year top-1% wealth-share outcome is missing unless the user
    supplies a WID archive. No such ZIP or a publisher-pinned revision is
    stored in the registry; publicly accessible downloads do not, by
    themselves, establish full-archive redistribution permission. WID shares
    are fractions of one; the downstream first-value pivot and missing-outcome
    checks require consumer-side validation before empirical use.
consumers:
  - wealth_rentier_dynamics
resolution:
  review_status: terminal
  last_reviewed: 2026-11-12
  blocker_category: redistribution-rights
  blocker_summary: >-
    WID.world advertises open access and documents bulk downloads, but the
    official data and documentation pages reviewed do not explicitly state
    terms permitting a separate repository to mirror its entire database ZIP.
  evidence:
    - "https://wid.world/data/"
    - "https://wid.world/codes-dictionary/"
    - "https://wid.world/methodology/"
    - "https://github.com/DiogoRibeiro7/wealth_rentier_dynamics/blob/bf0e75b91f68911e306627f257baf52893f0e91c/data/README.md"
    - "https://github.com/DiogoRibeiro7/wealth_rentier_dynamics/blob/bf0e75b91f68911e306627f257baf52893f0e91c/src/wealth_dynamics/data_sources.py"
    - "https://github.com/DiogoRibeiro7/data/blob/main/docs/consumer-source-audits/wealth-rentier-dynamics-wid-2026-11-12.md"
  reviewer_note: >-
    The source URL is an interactive download page, not an immutable archive
    URL. The consumer loader is implemented and unit-tested, but possession
    of a real ZIP and its checksum has not been independently verified. The
    bulk loader does not check embedded country codes, uses a first-value
    pivot for repeated year/percentile combinations, and only requires the
    top-1% result column to exist, not that every selected observation is
    present. This is a consumer quality gate, distinct from redistribution.
  next_action: >-
    Keep source downloads consumer-local and validate country, unit,
    unique-key, completeness and archive provenance before empirical use.
    Reopen central redistribution only if WID.world provides explicit
    full-database redistribution terms or a suitable licence; before any
    canonical promotion, identify a dated revision and checksum.
  terminal: true
