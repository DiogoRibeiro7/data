storage: authoritative-upstream
usage:
  storage: project-local
  redistribution: allowed
  attribution_required: true
  note: >-
    main/<locale>/characters.json gives each locale's exemplar characters;
    the main set is used as the language's standard alphabet (letters
    only; multi-letter sequences in braces and marks are skipped).
    medium-blog/letter-loops downloads the npm tarball at every run, checks
    its SHA-256 and extracts the characters.json of 36 locales into a local
    data/ folder that is not committed. Serbo-Croatian uses the hr locale.
    No bytes are mirrored here.
