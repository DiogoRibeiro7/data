  note: >-
    Criteo's original 2018 research page describes approximately 25.3
    million randomized advertising observations; its first-party Hugging
    Face v2.1 distribution has approximately 13.98 million rows. Treat
    these as distinct versions, not equal snapshots. Records contain
    anonymized projected features, treatment, visit, conversion and
    effective-exposure fields; nonuniform subsampling prevents recovery
    of the original incrementality level. The causal-uplift-marketing-
    campaign project offers a direct-url download mode, but the configured
    URL and any downloaded bytes remain unverified by this registry.
    The explicit CC BY-NC-SA 4.0 terms exclude commercial redistribution
    and require ShareAlike for adapted material. No data files are mirrored.
consumers:
