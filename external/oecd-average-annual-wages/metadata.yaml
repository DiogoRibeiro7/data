schema_version: 1
status: external-reference
id: oecd-average-annual-wages
title: "OECD real average annual wages (full-time equivalent, PPP adjusted)"
publisher: "Organisation for Economic Co-operation and Development (OECD)"
source_url: "https://www.oecd.org/en/data/indicators/average-annual-wages.html"
license:
  name: "OECD Data Terms & Conditions (verify any third-party or series-specific rights)"
  url: "https://www.oecd.org/en/about/terms-conditions.html"
redistribution: unresolved
storage: authoritative-upstream
usage:
  storage: project-local
  redistribution: unresolved
  attribution_required: true
  note: >-
    wealth_rentier_dynamics downloads OECD annual real average wages per
    full-time-equivalent dependent employee for PRT, ESP, FRA, ITA, IRL and NLD
    from dataflow OECD.ELS.SAE,DSD_EARNINGS@AV_AN_WAGE,1.0. Its SDMX key
    selects WG, USD_PPP and constant-price base Q from 1990, then derives
    a wage_growth column by pct_change. This is a mean wage measure, not median
    earnings or a household-income distribution. The consumer does not check
    that the returned series dimensions are unique, silently keeps the first
    value per year, and treats growth across gaps as one-year growth. OECD's
    currently published comparison uses constant 2025 US dollars at private-
    consumption PPPs; later rebasing/revision remains possible. Source-specific
    third-party rights have not been verified; no observations are mirrored.
consumers:
  - wealth_rentier_dynamics
resolution:
  review_status: actionable
  last_reviewed: 2026-11-09
  blocker_category: redistribution-rights
  blocker_summary: >-
    The OECD general reuse policy is permissive, but country-series third-
    party ownership remains unchecked. The consumer also discards duplicate
    year rows without validating remaining SDMX dimensions or unique source
    identity, and its nominally year-on-year growth can span missing years.
  evidence:
    - "https://www.oecd.org/en/about/terms-conditions.html"
    - "https://www.oecd.org/en/data/indicators/average-annual-wages.html"
    - "https://data-explorer.oecd.org/vis?df%5Bag%5D=OECD.ELS.SAE&df%5Bds%5D=dsDisseminateFinalDMZ&df%5Bid%5D=DSD_EARNINGS%40AV_AN_WAGE&df%5Bvs%5D=1.0&dq=..USD_PPP....&pd=2023%2C&pg=0&snb=26&tm=average+annual+wage&to%5BTIME_PERIOD%5D=false&vw=tb"
    - "https://github.com/DiogoRibeiro7/wealth_rentier_dynamics/blob/bf0e75b91f68911e306627f257baf52893f0e91c/src/wealth_dynamics/data_sources.py"
  reviewer_note: >-
    Real USD-PPP wage levels can be rebased or revised by OECD releases;
    dataflow version 1.0 is not an immutable observation vintage. Confirm
    the selected PPP base year, dimension codes and status flags at retrieval.
    A separate consumer-source audit documents the required parser fixes.
  next_action: >-
    In the consumer, validate exact REF_AREA, WG, USD_PPP, price base Q and
    other returned SDMX dimensions; reject conflicting duplicate year rows;
    compute wage_growth only for consecutive years and report gaps. Verify
    source ownership in OECD Data Explorer for all six areas; preserve the
    response URL, access timestamp, byte SHA-256, PPP reference year and
    transformation revision before proposing a canonical snapshot.
  terminal: false
