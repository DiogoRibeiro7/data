  note: >-
    Applies to directly retrieved INE statistical API responses, with source
    attribution and disclosure of modifications. It does not license PORDATA's
    separately produced Excel exports. The portugal-housing-generations v1.0.0
    release records 37 dated INE API response containers. The
    social-security-housing-investment research project separately pins INE
    construction cost, rent, census, income and housing-price indicators with
