  redistribution: unresolved
  attribution_required: true
  note: >-
    portugal-living-standards-reassessment manually transcribed three
    INE/PORDATA annual infant mortality landmarks (1960, 1974, 1990) on
    2026-10-31. The full table spans 1960–2025 in the provider's
    2026-08-05 publication. The official series marks breaks in 1980 and
    2021, and 2021–2024 observations were revised in June 2026. The 1980
    break changes residence inclusion in live births and infant deaths.
    Registration-based rates are not interchangeable with the UN IGME
    modeled series. No PORDATA export or transcription is mirrored here.
