  note: >-
    PWT 10.01 (January 2023) covers 183 countries, 1950-2019; the release is
    also on DataverseNL, doi:10.34894/QT5BCC. The consumer reads the R data
    file data/pwt10.01.rda of package pwt10 10.01-0 from the read-only GitHub
    mirror of CRAN at one fixed commit, so that a Git commit fixes the bytes,
    and checks its SHA-256.
    PWT 11.0 (October 2025, through 2023) supersedes it but has no pinned
    mirror yet. Variables used: cgdpo, emp, cn, hc (output-side GDP and capital stock at current PPPs, persons engaged, human capital index). Cite Feenstra, Inklaar
    and Timmer (2015), "The Next Generation of the Penn World Table",
    American Economic Review 105(10), 3150-3182. No bytes are mirrored here.
