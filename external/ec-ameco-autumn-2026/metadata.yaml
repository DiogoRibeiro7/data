  note: >-
    Medium-Blog/portugal-fiscal-reaction downloads the AMECO bulk file, verifies the
    SHA-256 recorded here and rebuilds an EU-27 annual panel (gross debt, primary
    balance, interest, output gap, cyclically adjusted primary balance, GDP, deflator,
    long-term interest rate) for 1994-2025 at each run; the Commission's forecast years
    2026-2028 are dropped. AMECO is replaced at every Commission forecast, so the hash
    identifies the autumn 2026 release (zip members dated 16 November 2026); after a new
    release the consumer stops unless run with --accept-revision. No bytes are stored in
    Medium-Blog or in this registry.
