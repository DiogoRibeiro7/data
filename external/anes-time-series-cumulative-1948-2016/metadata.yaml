  note: >-
    The cumulative file of the American National Election Studies time series, 59,944 respondents
    interviewed in 1948-2016, as an R data file in the anesr package at commit
    21a6c66b1467c73d994700ae14ba72fb7d9c11cb; the package redistributes the 2016 release of the file
    (later ANES releases add 2020 and 2024). The authoritative copy is at electionstudies.org behind
    a free registration. Variables used: VCF0004 (year), VCF0604 (trust the government in
    Washington), VCF0303 (party identification, three categories), VCF0106 (race), VCF0113 (political
    South), VCF0704a (two-party presidential vote) and the weight VCF0009z. Cite the American National
    Election Studies, ANES Time Series Cumulative Data File (1948-2016). No bytes are mirrored here.
