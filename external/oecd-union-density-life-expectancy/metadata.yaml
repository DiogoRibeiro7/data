title: "OECD SDMX responses: trade union density (DF_TUD) and life expectancy at birth (DF_LE), 13 countries, 1960-2024, retrieved 2026-11-28"
publisher: "Organisation for Economic Co-operation and Development (OECD); union density from the OECD/AIAS ICTWSS database"
