usage:
  storage: consumer-downloads-and-verifies
  redistribution: unresolved
  attribution_required: true
  note: >-
    Two SDMX-CSV responses for the United States, the United Kingdom, Austria, Belgium, Denmark,
    Finland, France, Germany, Italy, the Netherlands, Norway, Sweden and Switzerland, 1960-2024:
    trade union density in per cent of employees (OECD.ELS.SAE DSD_TUD_CBC@DF_TUD 1.0, MEASURE TUD,
    UNIT PT_SAL) and life expectancy at birth, both sexes, in years (OECD.ELS.HD DSD_HEALTH_STAT@DF_LE
    1.1, MEASURE LFEXP, AGE Y0, SEX _T). Two complete downloads 20 seconds apart on 2026-11-28 were
    byte-identical. The dataflows are mutable, so the hashes identify this retrieval only: after an
    OECD revision the consumer stops unless run with --accept-revision. Source characteristics kept
    as they are: life expectancy for the United Kingdom is missing in 1962-1969 and 1972-1979, for
    Denmark in 1961-1966 and for Italy in several 1960s years; union density for the United States is
    missing in 1981-1982 and for France before 1971. No bytes are mirrored here.
