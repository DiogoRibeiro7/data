schema_version: 1
status: external-reference
id: eurostat-multicountry-housing-tax-covariates
title: "Eurostat cross-country housing-cost, tenure and tax-account covariates"
publisher: "Eurostat (European Commission)"
source_url: "https://ec.europa.eu/eurostat/data/database"
license:
  name: "Eurostat free re-use policy (Commission Decision 2011/833/EU)"
  url: "https://ec.europa.eu/eurostat/help/copyright-notice"
redistribution: allowed
storage: authoritative-upstream
usage:
  storage: project-local
  redistribution: allowed
  attribution_required: true
  note: >-
    wealth_rentier_dynamics uses separate Eurostat JSON-stat datasets
    ilc_lvho07b (housing-cost overburden by income quintile, default QU1),
    ilc_lvps15 (tenure by citizenship and age, default citizen=NAT and
    tenure=OWN), and gov_10a_taxag (general-government tax-account aggregates
    as percent of GDP). Each API request and country remains distinct. Eurostat
    permits reuse with acknowledgement and modification notices subject to its
    published exceptions. No downloaded JSON snapshots are mirrored here.
consumers:
  - wealth_rentier_dynamics
resolution:
  review_status: actionable
  last_reviewed: 2026-11-06
  blocker_category: exact-snapshot-identity
  blocker_summary: >-
    No raw response files, SHA-256 checksums or extraction timestamps have
    been pinned for these cross-country Eurostat consumer requests. Eurostat's
    API publishes current datasets, not immutable historical API versions.
  evidence:
    - "https://ec.europa.eu/eurostat/help/copyright-notice"
    - "https://ec.europa.eu/eurostat/en/web/user-guides/data-browser/api-data-access/api-introduction"
    - "https://ec.europa.eu/eurostat/databrowser/view/tessi162/default/table?lang=en"
    - "https://ec.europa.eu/eurostat/databrowser/view/ilc_lvps15/default/table?lang=en"
    - "https://ec.europa.eu/eurostat/databrowser/view/gov_10a_taxag/default/table?lang=en"
    - "https://github.com/DiogoRibeiro7/wealth_rentier_dynamics/blob/f3e6e3a5b035b65d883ddd70f082f1fb6b34bc0a/src/wealth_dynamics/data_sources.py"
  reviewer_note: >-
    The three datasets are separate statistical products. In particular,
    ilc_lvps15 with citizen=NAT is not the home-ownership rate for all
    residents, while the D5 government tax receipts / GDP series is not an
    effective capital-tax rate.
  next_action: >-
    Capture the exact query, geography, dataset code and DOI, response
    timestamp, Eurostat update metadata, data/structure dimensions, raw
    JSON SHA-256, and transformation revision for each selected series before
    considering a canonical registry snapshot.
  terminal: false
