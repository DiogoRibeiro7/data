  note: >-
    Three CSV files of the archived owid/owid-datasets repository, read at commit
    6155d4ca1ea14ef30e753010a25521eeb416e8a2 (14 April 2025) so that a Git commit fixes the bytes.
    (1) "World Inequality Database (WID) - Pretax income": WID distributional national accounts,
    pre-tax national income, equal-split adults; the consumer uses the column
    "P99-P100 - share of the top 1%" (per cent) for the United States, the United Kingdom and
    eleven continental and Nordic countries, 1960-2017. (2) "Top income shares - World Wealth and
    Income Database (2018)": the older fiscal-income top 1% shares (fractions of one, despite the
    column name "Pre-tax national income"), used only as a check. (3) "Interpersonal Trust - General
    Social Survey (GSS)": the share of American adults answering that most people can be trusted,
    1972-2018. Cite WID.world (World Inequality Lab), the World Wealth and Income Database, NORC's
    General Social Survey, and Our World in Data. No bytes are mirrored here.
