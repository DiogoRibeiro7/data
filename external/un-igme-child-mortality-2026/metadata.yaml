  note: >-
    The UNICEF child-mortality dataset download specifies CC BY 3.0 IGO,
    distinct from the general website content licence. The UN IGME site
    identifies its latest global data update as 18 March 2026, with
    under-five, infant, child and neonatal estimates, sex breakdowns and
    source-data/estimate distinctions. Estimates have uncertainty intervals
    and model-based revisions. World Bank SP.DYN.IMRT.IN draws from the
