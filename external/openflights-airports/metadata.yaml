  note: >-
    airports.dat lists airports with IATA and ICAO codes, coordinates, altitude
    and time zone (UTC offset, DST rule and tz database name). The GitHub copy is
    a static snapshot of the live OpenFlights database that is updated only now
    and then, so the consumer pins the file to one commit of jpatokal/openflights
    and checks its size and SHA-256 at every run; no bytes are kept here. The
    consumer reads coordinates and standard-time offsets for 31 European
    airports (one hub, thirty outstations) to build a synthetic airline network.
    Derived tables that are made public must keep the ODbL attribution and
    share-alike terms. Attribution: OpenFlights, https://openflights.org/data.
