usage:
  storage: consumer-downloads-and-verifies
  redistribution: allowed
  attribution_required: true
  note: 'Medium-Blog/centres-users-residents downloads seven responses of the Eurostat dissemination API: six full-indicator city-statistics
    responses (urb_cpop1 and urb_lpop1 DE1001V, population on 1 January; urb_clma and urb_llma EC2020V, total employment at the place
    of work; urb_clivcon and urb_llivcon SA1001V, number of conventional dwellings), for cities and for functional urban areas, and
    nama_10_pe (EMP_DC, THS_PER), employment in the national accounts of every country, used to check the city jobs series against it.
    It rebuilds a centre-ring panel at each run. Eurostat serves identical bytes for identical data, so the pin is the SHA-256 of each
    response. A mismatch means Eurostat updated the data; the consumer then stops unless run with --accept-revision. Retrieved 23 November
    2026. No bytes are stored in Medium-Blog or in this registry.'
