  note: >-
    The repository that serves barrolee.com carries an MIT licence file, but
    the site footer reads "All rights reserved", so redistribution is left
    unresolved and no bytes are kept here. The consumer downloads two CSV
    files from one fixed commit and checks their SHA-256. BL_v3_MF2564.csv:
    attainment of the total population aged 25-64, 146 countries, 1950-2015
    at five-year intervals (version 3, September 2021, with the revised 2015
    estimate for the United States). OUP_long_MF2564_v1.csv: the long-run
    series built for Barro and Lee (2015), Education Matters, chapter 2,
    total population aged 25-64, 89 countries, 1870-2010 at five-year
    intervals. Cite Barro and Lee (2013), Journal of Development Economics
    104, 184-198, for version 3, and Barro and Lee (2015), Education Matters
    (Oxford University Press), for the long-run series.
