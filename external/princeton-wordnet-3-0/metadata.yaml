  note: >-
    Medium-Blog/curvature-prior downloads the WordNet 3.0 database as packaged in
    github.com/nltk/nltk_data at the pinned gh-pages commit, verifies the size and
    SHA-256 recorded here, and parses data.noun and index.noun at each run to build the
    mammal and food noun hypernym subtrees. Nothing from the package is committed in the
    consumer. Princeton's own download host refuses automated requests from the
    project's build environment; the NLTK package carries the unmodified WordNet 3.0
    database files with Princeton's LICENSE. Cite: Miller (1995) and Fellbaum (1998).
