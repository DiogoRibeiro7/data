schema_version: 1
status: external-reference
id: eurostat-portugal-citizenship-statistics
title: "Eurostat Portugal 1 January population by citizenship (migr_pop1ctz)"
publisher: "Eurostat (European Commission)"
source_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_pop1ctz?geo=PT&age=TOTAL&sex=T&unit=NR&sinceTimePeriod=2017"
license:
  name: "Eurostat free re-use policy (Commission Decision 2011/833/EU)"
  url: "https://ec.europa.eu/eurostat/help/copyright-notice"
redistribution: allowed
storage: authoritative-upstream
usage:
  storage: project-local
  redistribution: allowed
  attribution_required: true
  note: >-
    Applies to the Portugal population-by-citizenship Eurostat API dataset
    migr_pop1ctz with the indicated filters. The downstream research keeps a
    dated JSON-stat 2.0 response, source update timestamp and SHA-256. These
    statistical 1 January population estimates are distinct from preceding
    31 December SEF/AIMA administrative residence stocks. Some 2025
    Portugal nationality-specific response cells are absent and must not
    be converted to zero or estimated from totals. No API bytes are copied
    into the central registry.
consumers:
  - empirical-analysis-r
