storage: authoritative-upstream
usage:
  storage: consumer-downloads-and-verifies
  redistribution: allowed
  attribution_required: true
  note: 'Medium-Blog/centres-users-residents downloads nine INE API responses (indicators 0011654, census 2021 share of residents entering
    the municipality to work or study; 0012650, full-time employees on full pay by place of work, Quadros de Pessoal, MTSSS/GEP; 0013366,
    bed capacity in tourist accommodation; 0013249, dwellings completed in new construction for family housing) for the municipalities
    and rebuilds a panel of the Lisbon and Porto metro areas at each run. INE stamps every response with its extraction time (DataExtracao),
    so the pin is a content hash: SHA-256 of IndicadorCod, DataUltimoAtualizacao and Dados serialised as sorted-key JSON. A mismatch
    means INE revised the data; the consumer then stops unless run with --accept-revision. Retrieved 23 November 2026. No bytes are
    stored in Medium-Blog or in this registry.'
consumers:
