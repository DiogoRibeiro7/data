  note: >-
    The empirical-analysis-r migration study preserves report-specific
    2017–2022 annual SEF resident-permit stock tables, top-ten nationalities,
    separately labelled Other totals and nationality-by-sex annexes. The
    original SEF RIFA reporting vintage differs from later AIMA back-revisions
    and Eurostat population-by-citizenship estimates. Annex Stock figures
    are not residence-title Fluxos. Some original SEF links now require
    archived captures. Research transcriptions remain downstream; no source
    report or derived CSV is mirrored by this registry.
