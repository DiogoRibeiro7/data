title: "Freddie Mac Primary Mortgage Market Survey: 30-year fixed rate, weekly, 1971-2025, through FRED"
publisher: "Freddie Mac; distributed by the Federal Reserve Bank of St. Louis (FRED series MORTGAGE30US)"
source_url: "https://fred.stlouisfed.org/series/MORTGAGE30US"
redistribution: dataset-specific
storage: authoritative-upstream
usage:
  storage: authoritative-upstream
  redistribution: dataset-specific
  attribution_required: true
  note: >-
    Freddie Mac's terms grant a limited licence to publish automatically updated
    data content such as the PMMS with attribution, but not to republish
    Freddie Mac content in general, so no bytes are kept here. The consumer
    downloads the FRED graph CSV with fixed start and end dates (cosd and coed),
    which makes the response stable, and checks its SHA-256. Weekly averages of
    rates offered to borrowers with 20% down; Freddie Mac changed the survey's
    method in November 2022 without revising earlier weeks. Cite Freddie Mac,
    Primary Mortgage Market Survey.
