title: "MineThatData 2008 Hillstrom randomized email marketing experiment"
publisher: "Kevin Hillstrom / MineThatData (Kaggle copy uploaded by bofulee)"
source_url: "https://blog.minethatdata.com/2008/03/minethatdata-e-mail-analytics-and-data.html"
