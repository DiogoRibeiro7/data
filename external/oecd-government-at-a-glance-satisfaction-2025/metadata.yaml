  note: >-
    Dataflow OECD.GOV.GIP,DSD_GOV_INT@DF_GOV_SPS_2025, measures CS_HC
    (satisfaction with the healthcare system), CS_ES (education system) and
    TRUST_S_AS (administrative services), unit PT_RESP (percent of
    respondents satisfied). 2023 values come from the OECD Survey on Drivers
    of Trust in Public Institutions (30 countries plus the OECD figure);
    2021 values exist for some countries. The consumer keeps 2023 rows for
    countries with all three measures and averages them into a composite.
