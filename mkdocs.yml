site_name: Data Registry
site_description: Provenance-first registry for reusable datasets and external data sources.
site_url: https://diogoribeiro7.github.io/data/
repo_url: https://github.com/DiogoRibeiro7/data
repo_name: DiogoRibeiro7/data
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Catalogs:
      - Canonical datasets: generated/canonical-catalog.md
      - External sources: generated/external-catalog.md
      - Legacy quarantine: generated/legacy-inventory.md
  - Registry usage:
      - CLI: CLI.md
      - Consumers: CONSUMERS.md
      - Quality methodology: QUALITY.md
      - Quality report: generated/registry-quality.md
  - Governance:
      - Data policy: DATA_POLICY.md
      - External source health: EXTERNAL_HEALTH.md
      - Metadata: METADATA.md
      - Schemas: SCHEMAS.md
      - Migration: MIGRATION.md
      - Releases: RELEASES.md
      - Citation: CITATION.md
      - Contributing: CONTRIBUTING.md
  - Migration audits:
      - External source audit: migrations/EXTERNAL_SOURCE_AUDIT_2026-10-01.md
      - Second canonical dataset decision: migrations/SECOND_CANONICAL_DATASET_2026-10-02.md
      - Maize Bipolaris promotion: migrations/MAIZE_BIPOLARIS_PROMOTION_2026-10-03.md
      - UCDP GED 25.1 promotion: migrations/UCDP_GED_25_1_PROMOTION_2026-10-03.md
      - Legacy resolution audit: migrations/LEGACY_RESOLUTION.md
      - Phase-four legacy re-audit: migrations/LEGACY_REAUDIT_2026-10-03.md
      - Italy legacy workbook re-audit: migrations/ITALY_LEGACY_REAUDIT_2026-10-03.md
      - Consumer audit: migrations/CONSUMER_AUDIT.md
      - Medium Blog audit: migrations/MEDIUM_BLOG_DATA.md
      - Project data audit: migrations/PROJECT_DATA_AUDIT.md
      - Portugal Data audit: migrations/PORTUGAL_DATA.md
