notes: >
  Folder estado-novo-legacy reads all four raw files of the dataset, not only
  the one named here. Medium-Blog records the registry commit, URL, size and
  SHA-256 of each file in data_sources/eurostat-eu-convergence-education.json;
  estado-novo-legacy/fetch.py downloads them at every run and stops if any
  byte differs. The same folder reads the external references
  barro-lee-educational-attainment, penn-world-table-10-01 and owid-co2-data
  through their own contracts.
