  Folder rent-or-buy-us reads all twelve raw files of the dataset, not only the
  one named here: six ACS 1-year tables for 2022 and 2023 (tenure, rooms,
  contract rent, gross rent, home value and real estate taxes). Medium-Blog
  records the registry commit, URL, size and SHA-256 of each file in
  data_sources/census-acs-housing-costs-msa.json; rent-or-buy-us/fetch.py
  downloads them at every run and stops if any byte differs.
